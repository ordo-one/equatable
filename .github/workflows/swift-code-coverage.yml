name: Swift code coverage

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, next ]
jobs:
  test-code-coverage:
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - name: Install deps
      run: |
        apt-get update -q && apt-get install -y -q libjemalloc-dev curl

    - name: Swift version
      run: swift --version

    - name: Start consul
      uses: ./.github/actions/consul-start

    - name: Run tests
      continue-on-error: true
      run: |
        [ -d Tests ] && swift test --parallel --enable-code-coverage

    - name: Export code coverage
      run: |
        coverage_json=$(swift test --show-codecov-path)
        coverage_dir=$(dirname "${coverage_json}")
        products_dir=$(dirname "${coverage_dir}")
        test_binary=$(find "${products_dir}" -maxdepth 4 -type f -perm -111 \
          \( -name "*.xctest" -o -name "*Tests" -o -name "*Tests-test-runner" \) \
          -print -quit)
        profdata="${coverage_dir}/default.profdata"
        if [ -z "${test_binary}" ] || [ ! -f "${profdata}" ]; then
          echo "Unable to locate the test binary or coverage profile"
          exit 1
        fi
        echo "Will llvm-cov '${test_binary}'"
        llvm-cov export -format="lcov" "${test_binary}" \
          -instr-profile "${profdata}" > info.lcov

    - name: Upload codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_REPO_TOKEN }}
        files: info.lcov
        fail_ci_if_error: true
